<meta name="robots" content="noindex, nofollow">
<title>Artisan André Père & Fils</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #F5F5F7;
    --ink: #1D1D1F;
    --ink-soft: #6E6E73;
    --accent: #16415F;
    --live: #FF3B30;
    --shadow: 0 10px 30px rgba(0,0,0,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1D1D1F; --ink: #F5F5F7; --ink-soft: #A1A1A6;
      --accent: #62B4EC; --live: #FF453A; --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1D1D1F; --ink: #F5F5F7; --ink-soft: #A1A1A6;
    --accent: #62B4EC; --live: #FF453A; --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.47059; -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 15vh 24px 64px; text-align: center; }
  @media (max-width: 480px) { .wrap { padding-top: 12vh; } }

  .label { font-size: 15px; font-weight: 590; color: var(--accent); margin-bottom: 14px; }

  h1 {
    font-size: clamp(32px, 5.6vw, 48px); font-weight: 600; letter-spacing: -0.022em;
    line-height: 1.07; margin: 0 0 16px; text-wrap: balance;
  }

  .sub {
    font-size: 19px; font-weight: 400; color: var(--ink-soft); line-height: 1.5;
    max-width: 38ch; margin: 0 auto 56px;
  }

  .stage { position: relative; width: 152px; height: 152px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
  .orb-ring {
    position: absolute; inset: -16px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--accent) 0%, transparent 68%);
    opacity: 0; filter: blur(3px); transition: opacity 0.5s ease;
  }
  .orb-ring.pulse { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(0.92); opacity: 0.22; }
    50% { transform: scale(1.18); opacity: 0.42; }
  }
  @media (prefers-reduced-motion: reduce) { .orb-ring.pulse { animation: none; opacity: 0.3; } }

  button.talk {
    position: relative; width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 590;
    font-family: inherit; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow);
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), background 0.2s ease;
  }
  button.talk:hover { transform: scale(1.035); }
  button.talk:active { transform: scale(0.97); }
  button.talk:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  button.talk.live { background: var(--live); }
  button.talk:disabled { opacity: 0.35; cursor: not-allowed; }
  button.talk:disabled:hover { transform: none; }
  button.talk svg { width: 26px; height: 26px; }

  .status { font-size: 14px; color: var(--ink-soft); min-height: 18px; margin-bottom: 18px; }
  .status.live-status { color: var(--live); }

  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
  .ctrl-btn {
    font-family: inherit; font-size: 14px; font-weight: 500; padding: 9px 18px;
    border-radius: 980px; border: none; background: var(--surface); color: var(--ink);
    cursor: pointer; transition: opacity 0.15s ease;
  }
  .ctrl-btn:hover { opacity: 0.7; }
  .ctrl-btn[hidden] { display: none; }

  .transcript {
    width: 100%; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding: 20px 4px 0; text-align: left;
  }
  .transcript:empty { display: none; }
  .line { font-size: 15px; line-height: 1.5; }
  .line b { font-weight: 590; color: var(--accent); margin-right: 6px; }
  .line.user b { color: var(--ink-soft); }

  .foot { margin-top: 64px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
</style>

<div class="wrap">
  <div class="label">Artisan André Père & Fils</div>
  <h1>Une permanence qui ne s'arrête jamais.</h1>
  <p class="sub">24h/24, 7j/7, comme depuis 1994. Voici à quoi pourrait ressembler votre accueil téléphonique.</p>

  <div class="stage">
    <div class="orb-ring" id="ring1"></div>
    <div class="orb-ring" id="ring2"></div>
    <button class="talk" id="talkBtn" aria-label="Parler à Léa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      <span id="btnLabel">Parler à Léa</span>
    </button>
  </div>
  <div class="status" id="statusText">Prête à démarrer</div>
  <div class="controls">
    <button class="ctrl-btn" id="muteBtn" hidden>Couper le micro</button>
    <button class="ctrl-btn" id="endBtn" hidden>Terminer l'appel</button>
  </div>
  <div class="transcript" id="transcript"></div>

  <p class="foot">Démo interactive, non connectée à votre ligne réelle.<br>Aucun appel n'est facturé ni enregistré dans un agenda.</p>
</div>

<script>
(async () => {
  const PUBLIC_KEY = "0e0d88eb-935d-4a0f-bf6c-51fbd809600f";
  const ASSISTANT_ID = "683ac3aa-6f94-4e4e-8c5a-27d5d5b2024a";

  const talkBtn = document.getElementById("talkBtn");
  const btnLabel = document.getElementById("btnLabel");
  const statusText = document.getElementById("statusText");
  const muteBtn = document.getElementById("muteBtn");
  const endBtn = document.getElementById("endBtn");
  const transcript = document.getElementById("transcript");
  const ring1 = document.getElementById("ring1");
  const ring2 = document.getElementById("ring2");

  let inCall = false;
  let muted = false;
  let vapi = null;

  function log(msg) {
    // Diagnostic trace for developers only (browser console) — kept out of
    // the visible page so clients see a clean, non-technical demo.
    console.log("[démo vocale] " + msg);
  }

  function showError(msg) {
    statusText.textContent = msg;
    statusText.classList.add("live-status");
    log("ERREUR : " + msg);
  }
  window.addEventListener("error", (e) => showError("Erreur technique : " + (e.message || "inconnue")));
  window.addEventListener("unhandledrejection", (e) => showError("Erreur technique : " + (e.reason && e.reason.message ? e.reason.message : String(e.reason))));

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(label + " n'a pas répondu après " + (ms / 1000) + "s (bloqué, probablement une permission refusée silencieusement)")), ms)),
    ]);
  }

  function setIdle() {
    inCall = false;
    talkBtn.classList.remove("live");
    btnLabel.textContent = "Parler à Léa";
    statusText.textContent = "Prête à démarrer";
    statusText.classList.remove("live-status");
    muteBtn.hidden = true;
    endBtn.hidden = true;
    ring1.classList.remove("pulse");
    ring2.classList.remove("pulse");
    talkBtn.disabled = false;
  }

  function addLine(role, text) {
    if (!text) return;
    const div = document.createElement("div");
    div.className = "line " + (role === "user" ? "user" : "assistant");
    div.innerHTML = "<b>" + (role === "user" ? "Vous" : "Léa") + "</b>" + text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  log("Script démarré.");
  talkBtn.disabled = true;
  btnLabel.textContent = "Chargement…";
  statusText.textContent = "Chargement de l'assistant…";

  log("navigator.mediaDevices disponible : " + (typeof navigator.mediaDevices !== "undefined"));

  let VapiCtor;
  try {
    log("Chargement du SDK Vapi…");
    const mod = await withTimeout(import("https://cdn.jsdelivr.net/npm/@vapi-ai/web/+esm"), 20000, "Le chargement de l'assistant");
    VapiCtor = (mod.default && mod.default.default) || mod.default || mod.Vapi || mod;
    if (typeof VapiCtor !== "function") throw new Error("SDK chargé mais mal formé");
    log("SDK chargé avec succès.");
  } catch (e) {
    btnLabel.textContent = "Indisponible";
    const detail = (e && e.message) ? e.message : "erreur inconnue";
    showError("Impossible de charger l'assistant (" + detail + "). Si vous utilisez un bloqueur de publicités (AdBlock, uBlock…), désactivez-le pour ce site puis rechargez la page.");
    return; // talkBtn stays disabled: nothing loaded to retry with until the page reloads
  }

  try {
    vapi = new VapiCtor(PUBLIC_KEY);
    log("Instance Vapi créée.");
  } catch (e) {
    showError("Erreur d'initialisation : " + (e && e.message ? e.message : "clé publique invalide."));
    return;
  }

  talkBtn.disabled = false;
  btnLabel.textContent = "Parler à Léa";
  statusText.textContent = "Prête à démarrer";

  talkBtn.addEventListener("click", async () => {
    log("Clic reçu sur le bouton.");
    if (inCall) { log("Déjà en appel — clic ignoré."); return; }
    talkBtn.disabled = true;

    statusText.textContent = "Autorisation du micro…";
    log("Demande d'accès au micro (getUserMedia)…");
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("navigator.mediaDevices.getUserMedia est indisponible dans ce cadre (bloqué par la sandbox).");
      }
      const stream = await withTimeout(navigator.mediaDevices.getUserMedia({ audio: true }), 8000, "La demande de micro");
      log("Micro autorisé.");
      stream.getTracks().forEach((t) => t.stop());
    } catch (e) {
      showError("Micro bloqué (" + (e && e.name ? e.name : "erreur") + ") : " + (e && e.message ? e.message : "inconnue") + " — autorisez l'accès au micro pour ce site puis réessayez.");
      btnLabel.textContent = "Parler à Léa";
      talkBtn.disabled = false;
      return;
    }

    statusText.textContent = "Connexion en cours…";
    log("Appel de vapi.start(" + ASSISTANT_ID + ")…");
    try {
      await withTimeout(vapi.start(ASSISTANT_ID), 15000, "vapi.start()");
      log("vapi.start() a répondu sans erreur.");
    } catch (e) {
      showError("Erreur de connexion : " + (e && e.message ? e.message : "réessayez."));
      btnLabel.textContent = "Parler à Léa";
      talkBtn.disabled = false;
    }
  });
  log("Écouteur de clic attaché au bouton.");

  endBtn.addEventListener("click", () => { log("Clic sur Terminer l'appel."); vapi.stop(); });

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    vapi.setMuted(muted);
    muteBtn.textContent = muted ? "Réactiver le micro" : "Couper le micro";
    log("Micro " + (muted ? "coupé" : "réactivé") + ".");
  });

  vapi.on("call-start", () => {
    log("Événement call-start reçu.");
    inCall = true;
    talkBtn.disabled = false;
    talkBtn.classList.add("live");
    btnLabel.textContent = "En appel";
    statusText.textContent = "Léa vous écoute…";
    statusText.classList.remove("live-status");
    muteBtn.hidden = false;
    endBtn.hidden = false;
    ring1.classList.add("pulse");
    ring2.classList.add("pulse");
    transcript.innerHTML = "";
  });

  vapi.on("speech-start", () => { statusText.textContent = "Léa parle…"; });
  vapi.on("speech-end", () => { if (inCall) statusText.textContent = "Léa vous écoute…"; });

  vapi.on("message", (msg) => {
    if (msg.type === "transcript" && msg.transcriptType === "final") {
      addLine(msg.role, msg.transcript);
    }
  });

  vapi.on("call-end", () => { setIdle(); });
  vapi.on("error", (e) => {
    console.error(e);
    showError("Erreur pendant l'appel : " + (e && e.message ? e.message : JSON.stringify(e)));
    inCall = false;
    ring1.classList.remove("pulse");
    ring2.classList.remove("pulse");
    talkBtn.classList.remove("live");
    btnLabel.textContent = "Parler à Léa";
    muteBtn.hidden = true;
    endBtn.hidden = true;
    talkBtn.disabled = false;
  });
})();
</script>
